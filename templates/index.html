<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Panel | ShopSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #050505; color: #fff; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #0f0f13; border-right: 1px solid #222; padding: 20px; overflow-y: auto; }
        .sidebar h2 { font-size: 18px; margin-bottom: 30px; text-align: center; }
        .sidebar h2 span { color: #a855f7; }
        .nav-item { padding: 12px; border-radius: 10px; cursor: pointer; color: #888; font-size: 13px; font-weight: bold; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover, .nav-item.active { background: rgba(99,102,241,0.2); color: #fff; }
        .nav-cat { font-size: 11px; color: #555; text-transform: uppercase; margin: 20px 0 10px 10px; font-weight: bold; }
        .main { flex: 1; padding: 30px; }
        .box { background: #0f0f13; border: 1px solid #222; border-radius: 16px; padding: 30px; max-width: 850px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 15px; background: #000; border: 1px solid #333; border-radius: 10px; color: #fff; }
        .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #6366f1, #a855f7); border: none; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; }
        .term { background: #000; border: 1px solid #333; border-radius: 10px; padding: 15px; font-family: monospace; font-size: 13px; color: #10b981; white-space: pre-wrap; margin-top: 20px; max-height: 400px; overflow-y: auto; display: none; }
        .api-box { background: rgba(251,191,36,0.1); border: 1px solid #fbbf24; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none; }
        .api-box input { width: 100%; padding: 10px; background: #000; border: 1px solid #555; border-radius: 8px; color: #fff; margin-top: 5px; }
        .admin-link { color: #fbbf24 !important; border: 1px solid rgba(251,191,36,0.3); margin-top: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>SHOP<span>SPHERE</span></h2>
        
        <div class="nav-cat">OPENARCHIVEX</div>
        <div class="nav-item" onclick="load('oax_status', this)"><i class="fa-solid fa-server"></i> Sistem Durumu</div>
        <div class="nav-item" onclick="load('oax_providers', this)"><i class="fa-solid fa-database"></i> Sağlayıcılar</div>
        <div class="nav-item" onclick="load('oax_pricing', this)"><i class="fa-solid fa-tags"></i> Fiyatlandırma</div>
        <div class="nav-item" onclick="load('oax_sources', this)"><i class="fa-solid fa-layer-group"></i> Kaynaklar</div>
        <div class="nav-item" onclick="load('oax_forum', this)"><i class="fa-solid fa-comments"></i> Forum</div>
        <div class="nav-item" onclick="load('oax_intelx_search', this)"><i class="fa-solid fa-magnifying-glass"></i> IntelX Arama</div>
        <div class="nav-item" onclick="load('oax_discord', this)"><i class="fa-brands fa-discord"></i> Discord OSINT</div>
        <div class="nav-item" onclick="load('oax_tiktok', this)"><i class="fa-brands fa-tiktok"></i> TikTok OSINT</div>
        
        <div class="nav-cat">TEMEL SORGULAR</div>
        <div class="nav-item" onclick="load('adsoyad', this)"><i class="fa-solid fa-user"></i> Mernis Sorgu</div>
        <div class="nav-item" onclick="load('aile', this)"><i class="fa-solid fa-users"></i> Aile Sorgu</div>
        <div class="nav-item" onclick="load('plaka_sorgu', this)"><i class="fa-solid fa-car"></i> Plaka Sorgu</div>
        <div class="nav-item" onclick="load('api_whois', this)"><i class="fa-solid fa-globe"></i> WHOIS Sorgu</div>
        <div class="nav-item" onclick="load('api_bin', this)"><i class="fa-solid fa-credit-card"></i> BIN Sorgu</div>
        
        <a href="/admin-panel-x9" class="nav-item admin-link"><i class="fa-solid fa-shield-halved"></i> Admin Paneli</a>
        <div class="nav-item" onclick="logout()" style="color:#ef4444; margin-top: 10px;"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</div>
    </div>
    <div class="main">
        <div class="box" id="box">
            <h2 style="margin-bottom:20px;">Hoş Geldin, {{ username }}</h2>
            <p style="color:#888;">Sol menüden bir araç seç.</p>
        </div>
    </div>
    <script>
        const $ = id => document.getElementById(id);
        const H = { 'Content-Type': 'application/json', 'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content };
        const TOOLS = {
            'oax_status': { t: 'Sistem Durumu', f: [] },
            'oax_providers': { t: 'Sağlayıcılar', f: [] },
            'oax_pricing': { t: 'API Fiyatlandırma', f: [] },
            'oax_sources': { t: 'Sızıntı Kaynakları', f: [] },
            'oax_forum': { t: 'Forum Özeti', f: [] },
            'oax_intelx_search': { t: 'IntelX Arama', api: true, f: [{ id: 'query', l: 'Aranacak Kelime' }] },
            'oax_discord': { t: 'Discord OSINT', api: true, f: [{ id: 'username', l: 'Kullanıcı Adı' }] },
            'oax_tiktok': { t: 'TikTok OSINT', api: true, f: [{ id: 'username', l: 'Kullanıcı Adı' }] },
            'adsoyad': { t: 'Mernis Sorgu', f: [{ id: 'ad', l: 'Ad' }, { id: 'soyad', l: 'Soyad' }] },
            'aile': { t: 'Aile Sorgu', f: [{ id: 'tc', l: 'TC Kimlik No' }] },
            'plaka_sorgu': { t: 'Plaka Sorgu', f: [{ id: 'plaka', l: 'Plaka (örn: 34ABC123)' }] },
            'api_whois': { t: 'WHOIS Sorgu', f: [{ id: 'domain', l: 'Domain (örn: google.com)' }] },
            'api_bin': { t: 'BIN Sorgu', f: [{ id: 'bin', l: 'Kart İlk 6 Hane' }] }
        };
        let current = null;
        function load(type, el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            current = type;
            const tool = TOOLS[type];
            let html = `<h2 style="margin-bottom:20px;">${tool.t}</h2>`;
            if(tool.api) {
                html += `<div class="api-box" style="display:block;"><label style="font-size:12px; color:#fbbf24; font-weight:bold;">OpenArchiveX API Key</label><input type="password" id="oaxKey" placeholder="API Key girin..."></div>`;
            }
            html += `<form id="qForm">`;
            tool.f.forEach(f => { html += `<div class="form-group"><label>${f.l}</label><input type="text" id="inp_${f.id}" required></div>`; });
            html += `<button type="submit" class="btn" id="btn">Sorgula</button></form><div class="term" id="term"></div>`;
            $('box').innerHTML = html;
            $('qForm').onsubmit = e => { e.preventDefault(); run(); };
        }
        async function run() {
            const payload = { type: current };
            TOOLS[current].f.forEach(f => { payload[f.id] = $('inp_'+f.id).value.trim(); });
            if(TOOLS[current].api) {
                const k = $('oaxKey').value.trim();
                if(!k) return alert('API Key gerekli!');
                payload.api_key = k;
            }
            const btn = $('btn'), term = $('term');
            btn.disabled = true; btn.innerText = 'Bekleniyor...';
            term.style.display = 'block'; term.innerText = '> İstek gönderiliyor...';
            try {
                const r = await fetch('/api/sorgu', { method:'POST', headers:H, body:JSON.stringify(payload) }).then(x=>x.json());
                if(r.success) term.innerText = '> BAŞARILI\n\n' + JSON.stringify(r.data, null, 2);
                else term.innerText = '> HATA: ' + r.error;
            } catch(e) { term.innerText = '> Bağlantı hatası.'; }
            btn.disabled = false; btn.innerText = 'Sorgula';
        }
        async function logout() { await fetch('/api/logout', {method:'POST', headers:H}); location.href='/login'; }
    </script>
</body>
</html>
