<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ShopSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #6366f1; font-size: 32px; margin-bottom: 10px; }
        p { color: #94a3b8; }
        .btn { background: #6366f1; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 20px;}
    </style>
</head>
<body>
    <div class="card">
        <h1>Sistem Çalışıyor!</h1>
        <p>Tebrikler, HTML dosyası doğru yüklendi.</p>
        <p style="margin-top:10px; font-size:12px;">Kullanıcı: {{ username }}</p>
        <a href="/api/logout" class="btn">Çıkış Yap</a>
    </div>
</body>
</html>
