<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Giriş | ShopSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden; }
        .bg-glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(37,99,235,0.2) 0%, transparent 70%); top: -100px; left: -100px; z-index: 0; }
        .container { width: 100%; max-width: 480px; position: relative; z-index: 1; }
        .card { background: #1e293b; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); overflow: hidden; border: 1px solid #334155; }
        .card-header { padding: 35px 30px 20px; text-align: center; }
        .logo-icon { width: 64px; height: 64px; background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; margin-bottom: 16px; box-shadow: 0 10px 20px rgba(37,99,235,.3); }
        .card-header h1 { font-size: 26px; font-weight: 800; color: #f8fafc; letter-spacing: -0.5px; }
        .card-header p { font-size: 14px; color: #94a3b8; margin-top: 6px; }
        .tabs { display: flex; background: #0f172a; padding: 6px; border-radius: 14px; margin: 0 30px; }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: 700; color: #64748b; border-radius: 10px; cursor: pointer; transition: .3s; user-select: none; }
        .tab.active { background: #1e293b; color: #60a5fa; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
        .form-body { padding: 30px; }
        .form-panel { display: none; animation: slideUp .4s ease; }
        .form-panel.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
        .form-group input { width: 100%; padding: 15px 45px 15px 15px; border: 1.5px solid #334155; border-radius: 12px; font-size: 15px; color: #f8fafc; background: #0f172a; transition: .2s; }
        .form-group input:focus { outline: none; border-color: #2563eb; background: #1e293b; box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
        
        .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
        .avatar-opt { width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: .2s; background: #0f172a; padding: 2px; object-fit: cover; }
        .avatar-opt:hover { transform: scale(1.1); }
        .avatar-opt.selected { border-color: #2563eb; background: rgba(37,99,235,0.2); }
        .upload-btn { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #334155; color: #94a3b8; font-size: 18px; cursor: pointer; transition: .2s; }
        .upload-btn:hover { background: #475569; color: #fff; }
        .upload-btn.selected { border: 2px solid #2563eb; background: rgba(37,99,235,0.2); color: #60a5fa; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #2563eb, #1d4ed8); cursor: pointer; transition: .2s; display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37,99,235,.3); }
        .btn:disabled { opacity: .7; cursor: not-allowed; }
        .alert { display: none; padding: 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 20px; align-items: flex-start; gap: 10px; }
        .alert.show { display: flex; }
        .alert-error { background: rgba(239,68,68,0.1); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
        .alert-success { background: rgba(16,185,129,0.1); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); }
        .footer-text { text-align: center; font-size: 13.5px; color: #94a3b8; margin-top: 25px; }
        .footer-text a { color: #60a5fa; font-weight: 700; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <h1>ShopSphere</h1>
                <p>Sorgu ve İstihbarat Paneli</p>
            </div>
            <div class="tabs">
                <div class="tab active" data-tab="login">Giriş Yap</div>
                <div class="tab" data-tab="register">Kayıt Ol</div>
            </div>
            <div class="form-body">
                <!-- GİRİŞ YAP EKRANI -->
                <div class="form-panel active" id="panel-login">
                    <div class="alert alert-error" id="loginErr"><i class="fa-solid fa-circle-exclamation"></i><span></span></div>
                    <form id="loginForm" novalidate>
                        <div class="form-group">
                            <label>Kullanıcı Adı</label>
                            <input type="text" id="login-u" placeholder="Kullanıcı adınız" required>
                        </div>
                        <div class="form-group">
                            <label>Şifre</label>
                            <input type="password" id="login-p" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button>
                    </form>
                    <div class="footer-text">Hesabınız yok mu? <a data-tab="register">Hemen Kayıt Olun</a></div>
                </div>
                
                <!-- KAYIT OL EKRANI -->
                <div class="form-panel" id="panel-register">
                    <div class="alert alert-error" id="regErr"><i class="fa-solid fa-circle-exclamation"></i><span></span></div>
                    <div class="alert alert-success" id="regOk"><i class="fa-solid fa-circle-check"></i><span></span></div>
                    <form id="registerForm" novalidate>
                        <div class="form-group">
                            <label>Profil Resmi Seç</label>
                            <div class="avatar-grid" id="avatarGrid">
                                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=A" class="avatar-opt" data-url="https://api.dicebear.com/7.x/bottts/svg?seed=A">
                                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=B" class="avatar-opt" data-url="https://api.dicebear.com/7.x/bottts/svg?seed=B">
                                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=C" class="avatar-opt" data-url="https://api.dicebear.com/7.x/bottts/svg?seed=C">
                                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=D" class="avatar-opt" data-url="https://api.dicebear.com/7.x/bottts/svg?seed=D">
                                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=E" class="avatar-opt" data-url="https://api.dicebear.com/7.x/bottts/svg?seed=E">
                                <div class="avatar-opt upload-btn" id="uploadBtn" onclick="document.getElementById('avatarFile').click()"><i class="fa-solid fa-upload"></i></div>
                            </div>
                            <input type="file" id="avatarFile" accept="image/*" style="display:none;">
                        </div>
                        <div class="form-group">
                            <label>Kullanıcı Adı</label>
                            <input type="text" id="reg-u" placeholder="en_az_3_karakter" minlength="3" maxlength="32" required>
                        </div>
                        <div class="form-group">
                            <label>Şifre</label>
                            <input type="password" id="reg-p" placeholder="En az 6 karakter" minlength="6" required>
                        </div>
                        <div class="form-group">
                            <label>Şifre Tekrar</label>
                            <input type="password" id="reg-p2" placeholder="Şifrenizi tekrar girin" required>
                        </div>
                        <button type="submit" class="btn" id="registerBtn"><i class="fa-solid fa-user-plus"></i> Hesap Oluştur</button>
                    </form>
                    <div class="footer-text">Zaten üye misiniz? <a data-tab="login">Giriş Yapın</a></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const CSRF = document.querySelector('meta[name="csrf-token"]').content;
        const HEADERS = { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF };
        let selectedAvatar = "https://api.dicebear.com/7.x/bottts/svg?seed=A";
        
        // Hazır Avatarları Seçme
        document.querySelectorAll('.avatar-opt:not(.upload-btn)').forEach(img => {
            img.addEventListener('click', () => {
                document.querySelectorAll('.avatar-opt').forEach(i => i.classList.remove('selected'));
                img.classList.add('selected');
                selectedAvatar = img.dataset.url;
            });
        });
        document.querySelector('.avatar-opt:not(.upload-btn)').classList.add('selected');

        // Galeriden Fotoğraf Yükleme ve Kırpma
        $('avatarFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 150; canvas.height = 150;
                    
                    // Resmi tam ortadan kare olacak şekilde kırp
                    const size = Math.min(img.width, img.height);
                    const x = (img.width - size) / 2;
                    const y = (img.height - size) / 2;
                    ctx.drawImage(img, x, y, size, size, 0, 0, 150, 150);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    const uploadBtn = $('uploadBtn');
                    
                    // Butonun içine yüklenen resmi koy
                    uploadBtn.innerHTML = `<img src="${dataUrl}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                    
                    // Seçim sınıflarını temizle ve upload butonunu seç
                    document.querySelectorAll('.avatar-opt').forEach(i => i.classList.remove('selected'));
                    uploadBtn.classList.add('selected');
                    
                    selectedAvatar = dataUrl; 
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function showAlert(el, msg) { el.querySelector('span').textContent = msg; el.classList.add('show'); }
        function hideAlert(el) { el.classList.remove('show'); }
        function switchTab(name) {
            ['loginErr', 'regErr', 'regOk'].forEach(id => hideAlert($(id)));
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
            document.querySelectorAll('.form-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
            history.replaceState(null, '', '#' + name);
        }
        document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => switchTab(el.dataset.tab)));
        if (location.hash === '#register') switchTab('register');

        // GİRİŞ YAPMA İŞLEMİ
        $('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            hideAlert($('loginErr'));
            const u = $('login-u').value.trim(), p = $('login-p').value;
            if (!u || !p) return showAlert($('loginErr'), 'Tüm alanları doldurun.');
            
            const btn = $('loginBtn'); 
            btn.disabled = true; 
            btn.innerHTML = 'Giriş yapılıyor...';
            
            try {
                const res = await fetch('/api/login', { method: 'POST', headers: HEADERS, body: JSON.stringify({ username: u, password: p }) }).then(r => r.json());
                if (res.success) {
                    window.location.href = '/';
                } else { 
                    showAlert($('loginErr'), res.error); 
                    btn.disabled = false; 
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Giriş Yap'; 
                }
            } catch (_) { 
                showAlert($('loginErr'), 'Bağlantı hatası.'); 
                btn.disabled = false; 
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Giriş Yap'; 
            }
        });

        // KAYIT OLMA İŞLEMİ
        $('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            hideAlert($('regErr')); 
            hideAlert($('regOk'));
            
            const u = $('reg-u').value.trim(); 
            const p = $('reg-p').value; 
            const p2 = $('reg-p2').value;
            
            if (!u || !p || !p2) return showAlert($('regErr'), 'Tüm alanları doldurun.');
            if (p !== p2) return showAlert($('regErr'), 'Şifreler eşleşmiyor.');
            
            const btn = $('registerBtn'); 
            btn.disabled = true; 
            btn.innerHTML = 'Kayıt yapılıyor...';
            
            try {
                const res = await fetch('/api/register', { 
                    method: 'POST', 
                    headers: HEADERS, 
                    body: JSON.stringify({ username: u, password: p, avatar: selectedAvatar }) 
                }).then(r => r.json());
                
                if (res.success) { 
                    showAlert($('regOk'), 'Hesabınız oluşturuldu! Giriş sekmesine atanıyorsunuz...'); 
                    setTimeout(() => {
                        switchTab('login'); 
                        $('login-u').value = u; 
                        $('login-p').value = p;
                        btn.disabled = false; 
                        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Hesap Oluştur';
                    }, 1500);
                } else { 
                    showAlert($('regErr'), res.error); 
                    btn.disabled = false; 
                    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Hesap Oluştur'; 
                }
            } catch (_) { 
                showAlert($('regErr'), 'Bağlantı hatası.'); 
                btn.disabled = false; 
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Hesap Oluştur'; 
            }
        });
    </script>
</body>
</html>
