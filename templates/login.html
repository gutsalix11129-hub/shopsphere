<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | ShopSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #ffffff; width: 100%; max-width: 400px; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #2563eb; font-size: 28px; font-weight: 800; letter-spacing: -1px; }
        .logo p { color: #64748b; font-size: 14px; margin-top: 5px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #475569; font-weight: 600; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; color: #1e293b; transition: 0.2s; }
        .form-group input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .switch { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .switch span { color: #2563eb; cursor: pointer; font-weight: 600; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #ef4444; color: white; padding: 12px 24px; border-radius: 8px; font-weight: 500; transition: 0.3s; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <div class="login-card" id="loginBox">
        <div class="logo">
            <h1>ShopSphere</h1>
            <p>Sorgu ve İstihbarat Paneli</p>
        </div>
        <div class="form-group"><label>KULLANICI ADI</label><input type="text" id="u" placeholder="Kullanıcı adınızı girin"></div>
        <div class="form-group"><label>ŞİFRE</label><input type="password" id="p" placeholder="••••••••"></div>
        <button class="btn" onclick="login()">Sisteme Giriş Yap</button>
        <div class="switch">Hesabınız yok mu? <span onclick="toggle()">Hemen Kayıt Olun</span></div>
    </div>

    <div class="login-card" id="registerBox" style="display:none;">
        <div class="logo">
            <h1>Kayıt Ol</h1>
            <p>Sisteme katılmak için formu doldurun</p>
        </div>
        <div class="form-group"><label>KULLANICI ADI</label><input type="text" id="ru" placeholder="Kullanıcı adı belirleyin"></div>
        <div class="form-group"><label>ŞİFRE</label><input type="password" id="rp" placeholder="En az 6 karakter"></div>
        <button class="btn" onclick="register()">Hesap Oluştur</button>
        <div class="switch">Zaten hesabınız var mı? <span onclick="toggle()">Giriş Yapın</span></div>
    </div>

    <script>
        function toggle() { 
            let l=document.getElementById('loginBox'), r=document.getElementById('registerBox');
            l.style.display = l.style.display==='none'?'block':'none'; r.style.display = r.style.display==='none'?'block':'none'; 
        }
        function showToast(m) { let t=document.getElementById('toast'); t.innerText=m; t.className='toast show'; setTimeout(()=>t.className='toast',3000); }
        async function login() {
            let res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:document.getElementById('u').value, password:document.getElementById('p').value})}).then(r=>r.json());
            if(res.success) window.location.href = '/'; else showToast(res.error);
        }
        async function register() {
            let res = await fetch('/api/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:document.getElementById('ru').value, password:document.getElementById('rp').value})}).then(r=>r.json());
            if(res.success) { showToast('Kayıt başarılı! Giriş yapabilirsiniz.'); toggle(); } else showToast(res.error);
        }
    </script>
</body>
</html>
