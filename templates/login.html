<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Giriş Yap | ShopSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #000; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #fff; }
        canvas#bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.8; }
        .glass-card { position: relative; z-index: 10; width: 100%; max-width: 420px; background: rgba(10, 10, 15, 0.6); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 40px; box-shadow: 0 0 50px rgba(99,102,241,0.2); }
        .brand { text-align: center; margin-bottom: 30px; }
        .brand-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 15px; box-shadow: 0 0 30px rgba(168,85,247,0.5); }
        .brand h1 { font-size: 26px; font-weight: 800; background: linear-gradient(to right, #fff, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tabs { display: flex; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 14px; margin-bottom: 25px; }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: 700; color: #64748b; border-radius: 10px; cursor: pointer; transition: .3s; }
        .tab.active { background: rgba(255,255,255,0.1); color: #fff; }
        .form-panel { display: none; } .form-panel.active { display: block; }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 11px; font-weight: 800; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input { width: 100%; padding: 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 14px; transition: .3s; }
        .form-group input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 15px rgba(99,102,241,0.3); }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; transition: .3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(168,85,247,0.4); }
        .alert { display: none; padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 15px; }
        .alert.show { display: block; }
        .alert-error { background: rgba(239,68,68,0.1); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
        .alert-success { background: rgba(16,185,129,0.1); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <div class="glass-card">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h1>SHOP<span style="color:#a855f7;">SPHERE</span></h1>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Giriş Yap</div>
            <div class="tab" onclick="switchTab('register')">Kayıt Ol</div>
        </div>
        
        <div class="form-panel active" id="panel-login">
            <div class="alert alert-error" id="loginErr"></div>
            <form id="loginForm">
                <div class="form-group"><label>Kullanıcı Adı</label><input type="text" id="login-u" required></div>
                <div class="form-group"><label>Şifre</label><input type="password" id="login-p" required></div>
                <button type="submit" class="btn">Sisteme Bağlan</button>
            </form>
        </div>

        <div class="form-panel" id="panel-register">
            <div class="alert alert-error" id="regErr"></div>
            <div class="alert alert-success" id="regOk"></div>
            <form id="registerForm">
                <div class="form-group"><label>Kullanıcı Adı</label><input type="text" id="reg-u" required></div>
                <div class="form-group"><label>Şifre</label><input type="password" id="reg-p" required></div>
                <button type="submit" class="btn">Ağa Katıl</button>
            </form>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const CSRF = document.querySelector('meta[name="csrf-token"]').content;
        const HEADERS = { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF };

        // Arka plan animasyonu
        const c = $('bg'), ctx = c.getContext('2d'); let p = [];
        function resize() { c.width = innerWidth; c.height = innerHeight; } resize();
        addEventListener('resize', resize);
        for(let i=0; i<50; i++) p.push({x:Math.random()*c.width, y:Math.random()*c.height, vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5});
        function draw() {
            ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle='rgba(99,102,241,0.5)'; ctx.strokeStyle='rgba(99,102,241,0.1)';
            p.forEach((pt, i) => {
                pt.x+=pt.vx; pt.y+=pt.vy; if(pt.x<0||pt.x>c.width) pt.vx*=-1; if(pt.y<0||pt.y>c.height) pt.vy*=-1;
                ctx.beginPath(); ctx.arc(pt.x, pt.y, 2, 0, 7); ctx.fill();
                for(let j=i+1; j<p.length; j++) {
                    let dx = pt.x-p[j].x, dy = pt.y-p[j].y, d = Math.sqrt(dx*dx+dy*dy);
                    if(d<150) { ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(p[j].x, p[j].y); ctx.stroke(); }
                }
            }); requestAnimationFrame(draw);
        } draw();

        function switchTab(t) {
            document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', (t==='login'&&i===0)||(t==='register'&&i===1)));
            document.querySelectorAll('.form-panel').forEach(el => el.classList.remove('active'));
            $('panel-'+t).classList.add('active');
        }

        $('loginForm').onsubmit = async (e) => {
            e.preventDefault(); $('loginErr').classList.remove('show');
            const res = await fetch('/api/login', { method:'POST', headers:HEADERS, body:JSON.stringify({username:$('login-u').value, password:$('login-p').value}) }).then(r=>r.json());
            if(res.success) location.href='/'; else { $('loginErr').innerText = res.error; $('loginErr').classList.add('show'); }
        };

        $('registerForm').onsubmit = async (e) => {
            e.preventDefault(); $('regErr').classList.remove('show');
            const res = await fetch('/api/register', { method:'POST', headers:HEADERS, body:JSON.stringify({username:$('reg-u').value, password:$('reg-p').value}) }).then(r=>r.json());
            if(res.success) { $('regOk').innerText = 'Kayıt başarılı, giriş yapabilirsiniz.'; $('regOk').classList.add('show'); setTimeout(()=>switchTab('login'), 1500); } 
            else { $('regErr').innerText = res.error; $('regErr').classList.add('show'); }
        };
    </script>
</body>
</html>
